version: 2
updates:
  # Python deps (uv reads pyproject; pip ecosystem covers it).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  # GitHub Actions pinned versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # The runtime base image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
