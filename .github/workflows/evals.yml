name: evals

# The uplift gate makes real (paid) model calls, so it is NOT on every PR. Run it on
# demand, or on a bounded weekly schedule. It builds the ontology from data/ once,
# then runs the deterministic gate (with_harness vs a fair full-corpus baseline) and
# uploads the benchmark + the generated HELIXPAY.md. Informational by default — the
# hard `--gate` (delta>0) is available locally; on a fits-in-context snapshot a fair
# baseline is strong, so we report cost + correctness rather than block on delta.
on:
  workflow_dispatch:
    inputs:
      subset:
        description: "number of cases (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays — a bounded weekly check

jobs:
  uplift:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HOUSE_HARNESS_API_TOKEN: ${{ secrets.HOUSE_HARNESS_API_TOKEN }}
      HOUSE_HARNESS_MODEL: anthropic:claude-sonnet-4-6
      HOUSE_HARNESS_SERVE_MODE: live
      DATABASE_URL: sqlite:///./house_harness.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev

      - name: Build the ontology from data/ (one-time extraction)
        run: uv run house-harness run data/ --out out

      - name: Uplift + cost gate (deterministic)
        run: |
          SUBSET="${{ github.event.inputs.subset }}"
          [ "${{ github.event_name }}" = "schedule" ] && SUBSET="8"
          ARGS=""
          [ -n "$SUBSET" ] && ARGS="--subset $SUBSET"
          uv run python -m evals.harness $ARGS

      - name: Upload benchmark + harness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/benchmark.json
            out/HELIXPAY.md
            out/graph.json
