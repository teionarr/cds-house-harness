# Live deploy (Fly.io) — Python app + a SQLite file on a mounted volume = a real
# URL, not localhost. v1 owns the corpus in SQLite (no managed Postgres); the
# volume persists the ontology across scale-to-zero restarts; a cold boot re-ingests
# ONLY files that changed (hash manifest), not the whole corpus. `fly launch --no-deploy` then `fly volumes create hh_data -s 1`
# then `fly deploy`. Secrets: `fly secrets set ANTHROPIC_API_KEY=... \
# HOUSE_HARNESS_API_TOKEN=... LANGSMITH_API_KEY=...` (never commit).
app = "house-harness"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# 2GB is REQUIRED: the first-boot extraction holds the runtime (Python + LangChain +
# the web server) plus 8 concurrent doc extractions and the 4 vision images in memory
# at once — it OOMs at ~doc 40 on the 512MB default. After the DB is built and persists
# on the volume, boots skip ingest and run lean, but the build needs the headroom.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"

[env]
  HOUSE_HARNESS_MODEL = "anthropic:claude-sonnet-4-6"
  DATABASE_URL = "sqlite:////data/house_harness.db"   # on the mounted volume

# The container's ENTRYPOINT is `uv run house-harness`; this appends the command.
# Serve + ingest-on-boot, which ingests ONLY changed files (hash manifest) — a no-op
# in the Phase-1 mock skeleton, the real corpus load once live.
[processes]
  # The primary agent surface is the MCP server over streamable-http: reachable at
  # https://<app>.fly.dev/mcp (add with `claude mcp add --transport http`). The same
  # app also serves /health (open) and /ask (token-gated). Ingest changed files on boot.
  app = "mcp --transport streamable-http --ingest-on-boot data/"

[[mounts]]
  source = "hh_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true      # scale to zero; note cold-start in SOLUTION
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  path = "/health"               # unauthenticated probe
  interval = "15s"
  timeout = "2s"
